name: Container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r gateway/requirements.lock
      - name: Check installed dependencies
        run: python -m pip check
      - name: Isolated security and release regression checks
        run: python tools/run_checks.py
      - name: Validate Compose without deployment
        shell: bash
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          HOMEBOX_TOKEN=ci-placeholder docker compose --env-file .env.example config --quiet

  image:
    if: github.event_name != 'schedule' && github.ref != 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact image for smoke testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./gateway
          platforms: linux/amd64
          load: true
          push: false
          tags: homebox-mcp:ci
          labels: |
            org.opencontainers.image.source=https://github.com/3115a083/homebox-mcp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          provenance: false
      - name: Verify built image source and revision
        run: |
          docker image inspect homebox-mcp:ci --format '{{json .Config.Labels}}' | python -c 'import json, os, sys; labels=json.load(sys.stdin); assert labels["org.opencontainers.image.source"] == "https://github.com/" + os.environ["GITHUB_REPOSITORY"]; assert labels["org.opencontainers.image.revision"] == os.environ["GITHUB_SHA"]'
      - name: Smoke-test image imports and non-root runtime without network
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges -e HOMEBOX_TOKEN=ci-placeholder
          --entrypoint python homebox-mcp:ci -c
          "import os, bridge, gateway; assert os.getuid() == 10001; assert 'upload_item_photo' in gateway.TOOLS; print('Image smoke passed')"

  publish:
    if: github.repository == '3115a083/homebox-mcp' && github.repository_id == '1443134998' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [checks, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the exact image for smoke testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./gateway
          platforms: linux/amd64
          load: true
          push: false
          tags: homebox-mcp:ci
          labels: |
            org.opencontainers.image.source=https://github.com/3115a083/homebox-mcp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Verify built image source and revision
        run: |
          docker image inspect homebox-mcp:ci --format '{{json .Config.Labels}}' | python -c 'import json, os, sys; labels=json.load(sys.stdin); assert labels["org.opencontainers.image.source"] == "https://github.com/" + os.environ["GITHUB_REPOSITORY"]; assert labels["org.opencontainers.image.revision"] == os.environ["GITHUB_SHA"]'
      - name: Smoke-test image imports and non-root runtime without network
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges -e HOMEBOX_TOKEN=ci-placeholder
          --entrypoint python homebox-mcp:ci -c
          "import os, bridge, gateway; assert os.getuid() == 10001; assert 'upload_item_photo' in gateway.TOOLS; print('Image smoke passed')"
      - name: Check source identity and private package before publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_registry_privacy.py
      - name: Login to private GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push tested image and rollback tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/3115a083/homebox-mcp
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          docker tag homebox-mcp:ci "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:sha-$REVISION"
          docker tag homebox-mcp:ci "$IMAGE:latest"
          docker push "$IMAGE:latest"
      - name: Verify published package is private
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/check_registry_privacy.py --require-package

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without exposing secret values
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner .'
